<svg xmlns="http://www.w3.org/2000/svg" width="800" viewBox="0 0 800 130" role="img" aria-label="Shim — the startup, now live">
  <defs>
    <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- games-red plate -->
  <rect x="0" y="0" width="800" height="130" rx="4" fill="#a7282b"/>
  <rect x="0" y="0" width="800" height="130" rx="4" fill="url(#h2)"/>
  <rect x="0" y="0" width="800" height="130" rx="4" fill="none" stroke="#e60012" stroke-width="2"/>

  <!-- left-aligned copy -->
  <text x="14" y="34" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="40" font-weight="900" fill="#ffffff">SHIM</text>

  <rect x="14" y="48" width="86" height="18" rx="2" fill="#21242e"/>
  <text x="57" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="900" letter-spacing="1" fill="#f68d1f">NOW LIVE</text>

  <text x="14" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">The startup we're building — upgrade agents that keep your code current.</text>

  <!-- amber CTA chip, sized to its text, text centered on the chip -->
  <rect x="14" y="104" width="150" height="20" rx="2" fill="#ecab37"/>
  <text x="89" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5" fill="#21242e">VISIT GETSHIM.DEV</text>

  <!-- static rating squares, right edge (ESRB-style, no game) -->
  <g>
    <rect x="742" y="20" width="22" height="22" rx="2" fill="#21242e" stroke="#ecab37" stroke-width="2"/>
    <text x="753" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" fill="#ecab37">26</text>
    <rect x="742" y="48" width="22" height="22" rx="2" fill="#21242e" stroke="#f68d1f" stroke-width="2"/>
    <text x="753" y="63" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" fill="#f68d1f">04</text>
    <rect x="742" y="76" width="22" height="22" rx="2" fill="#21242e" stroke="#e60012" stroke-width="2"/>
    <text x="753" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" fill="#e60012">AI</text>
  </g>
</svg>
