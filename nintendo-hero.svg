<svg xmlns="http://www.w3.org/2000/svg" width="800" viewBox="0 0 800 150" role="img" aria-label="Jayanth Malladi — Nintendo-2001 hero">
  <defs>
    <pattern id="halftone" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="0.9" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <!-- carbon faceplate -->
  <rect x="0" y="0" width="800" height="150" rx="6" fill="#21242e"/>
  <rect x="0" y="0" width="800" height="150" rx="6" fill="url(#halftone)"/>
  <rect x="1" y="1" width="798" height="3" rx="2" fill="rgba(255,255,255,0.14)"/>

  <!-- left-aligned name: red hard-shadow + white face -->
  <text x="24" y="72" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="48" font-weight="900" fill="#e60012">JAYANTH MALLADI</text>
  <text x="21" y="69" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="48" font-weight="900" fill="#ffffff">JAYANTH MALLADI</text>

  <!-- label + tagline, left aligned -->
  <rect x="24" y="92" width="10" height="10" fill="#e60012"/>
  <text x="42" y="101" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#9fbee7">PORTFOLIO · HIGH-STAKES AI</text>
  <text x="24" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9fbee7">I turn odd ideas into working things with AI and code, and I keep the high score climbing.</text>

  <!-- static 1UP coin, top-right (no blink) -->
  <text x="700" y="34" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" letter-spacing="1" fill="rgba(159,190,231,0.8)">INSERT COIN</text>
  <circle cx="756" cy="112" r="22" fill="#ecab37" stroke="#21242e" stroke-width="1.5"/>
  <text x="756" y="117" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="12" font-weight="900" fill="#21242e">1UP</text>
</svg>
